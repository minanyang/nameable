name: Release

# Pushing a tag such as v0.1.0 publishes that version to npm with provenance, through npm trusted
# publishing (no token is stored), and creates the GitHub release from its CHANGELOG entry.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        # No dependency cache in a job that can publish, as npm's trusted publishing guide advises.
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the package version
        run: test "v$(node -p 'require("./packages/nameable/package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm verify
      # The tarball is packed by pnpm (it turns workspace: versions into real ones), installed and run
      # the way a user would, and only then published, with provenance.
      # Skipped when the version is already on npm, so a run that failed after publishing can be re-run.
      - name: Publish to npm
        run: |
          tarball="$(scripts/try-tarball.sh)"
          if npm view "nameable@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "nameable@${GITHUB_REF_NAME#v} is already published"
          else
            npm publish "$tarball" --access public --provenance
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " v " " {on=1; next} /^## / {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
