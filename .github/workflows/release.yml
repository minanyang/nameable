name: Release

# Pushing a tag such as v0.1.0 stages that version on npm with provenance, through npm trusted publishing
# (no token is stored), and drafts the GitHub release from docs/releases/<tag>.md. Nothing is public until a
# maintainer approves the staged version with 2FA (npmjs.com → Staged Packages, or `npm stage approve`),
# then publishes the draft: `gh release edit <tag> --draft=false`, and lists the version on the MCP Registry
# from server.json: `mcp-publisher login github && mcp-publisher publish` (the registry checks the public npm
# package's mcpName, so this waits for the approval).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        # No dependency cache in a job that can publish, as npm's trusted publishing guide advises.
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the package version
        run: test "v$(node -p 'require("./packages/nameable/package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm verify
      # The tarball is packed by pnpm (it turns workspace: versions into real ones), installed and run
      # the way a user would, and only then published, with provenance.
      - name: Check npm can stage packages (11.15.0 or later)
        run: |
          npm -v
          node -e 'const [a, b] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && b >= 15) ? 0 : 1)' "$(npm -v)"
      # The trusted publisher only allows staging: a compromised workflow cannot release on its own.
      # Skipped when the version is already published, so a run that failed after that can be re-run. A
      # version that is staged but not yet approved cannot be staged again; approve or reject it first.
      - name: Stage on npm
        run: |
          tarball="$(scripts/try-tarball.sh)"
          if npm view "nameable@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "nameable@${GITHUB_REF_NAME#v} is already published"
          else
            npm stage publish "$tarball" --access public --provenance
          fi
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
