name: MCP servers

# Publishes the MCP Registry list the mcp-registry channel downloads, on the `data` branch: every day the
# servers updated since the previous list, every server again once a week (scripts/mcp-servers.ts).
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Read every server instead of only the updated ones
        type: boolean
        default: false

permissions:
  contents: write

concurrency: mcp-servers

jobs:
  publish:
    runs-on: ubuntu-latest
    # A full read takes minutes; a registry that stalls should not hold the job for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The list lives on its own branch, with no history in common with main, so the daily commits stay out
      # of main's log and CI. The branch does not exist before the first run; the script then reads every
      # server.
      - name: Check out the previous list
        run: |
          git init -q data && cd data
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # Exit code 2: the branch is missing, rather than unreachable.
          status=0; git ls-remote -q --exit-code origin refs/heads/data > /dev/null || status=$?
          if [ "$status" = 0 ]; then
            git fetch -q --depth=1 origin data
            git checkout -q -b data FETCH_HEAD
          elif [ "$status" = 2 ]; then git checkout -q --orphan data
          else exit "$status"; fi
      - name: Build the list
        run: node scripts/mcp-servers.ts data/mcp-servers.tsv data/mcp-servers.tsv.new ${FULL:+--full} && mv data/mcp-servers.tsv.new data/mcp-servers.tsv
        env:
          FULL: ${{ inputs.full && '1' || '' }}
      # One commit a day, kept: a bad list can be reverted, and when a server appeared can be looked up.
      - name: Publish the list
        working-directory: data
        run: |
          git add mcp-servers.tsv
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "data: MCP Registry servers as of $(sed -n 's/^#asof\t//p' mcp-servers.tsv)"
          git push -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GITHUB_TOKEN: ${{ github.token }}
