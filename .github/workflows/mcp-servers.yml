name: MCP servers

# Publishes the MCP Registry list the mcp-registry channel downloads, on the `data` branch: every day the
# servers updated since the previous list, every server again once a week (scripts/mcp-servers.ts).
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Read every server instead of only the updated ones
        type: boolean
        default: false

permissions:
  contents: write

concurrency: mcp-servers

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The branch does not exist before the first run; the script then reads every server.
      - name: Read the previous list
        run: curl -fsS -o previous.tsv "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/mcp-servers.tsv" || true
      - name: Build the list
        run: mkdir out && node scripts/mcp-servers.ts previous.tsv out/mcp-servers.tsv ${FULL:+--full}
        env:
          FULL: ${{ inputs.full && '1' || '' }}
      # One commit, replaced each day, so the branch never grows.
      - name: Publish the list
        working-directory: out
        run: |
          git init -q -b data
          git add mcp-servers.tsv
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "data: MCP Registry servers"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GITHUB_TOKEN: ${{ github.token }}
